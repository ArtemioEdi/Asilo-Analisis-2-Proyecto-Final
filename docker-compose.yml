name: asilo-cabeza-de-algodon

# Al host solo se le publican dos puertos: 8090 (estacion web) y 8080
# (ms-gateway). Los microservicios viven solo en la red interna "asilo" y se
# llaman entre ellos por nombre de servicio.
#
# Sin GATEWAY_SECRETO en el .env el stack no levanta: no hay secreto por
# defecto en ninguna parte del codigo.

services:

  bd-asilo:
    image: mysql:8.4
    container_name: bd-asilo
    command:
      # Los nombres de los internos llevan tildes.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: America/Guatemala
      MYSQL_ROOT_PASSWORD: ${BD_CLAVE_ROOT:?falta BD_CLAVE_ROOT. Copie .env.ejemplo a .env}
      # Las lee 01-bases-y-usuarios.sh para crear los usuarios de servicio.
      BD_CLAVE_VIGIA: ${BD_CLAVE_VIGIA:?falta BD_CLAVE_VIGIA. Copie .env.ejemplo a .env}
      BD_CLAVE_PASTILLERO: ${BD_CLAVE_PASTILLERO:?falta BD_CLAVE_PASTILLERO. Copie .env.ejemplo a .env}
      BD_CLAVE_CAJA: ${BD_CLAVE_CAJA:?falta BD_CLAVE_CAJA. Copie .env.ejemplo a .env}
      BD_CLAVE_CONSULTAS: ${BD_CLAVE_CONSULTAS:?falta BD_CLAVE_CONSULTAS. Copie .env.ejemplo a .env}
    volumes:
      - bd-datos:/var/lib/mysql
      # Los archivos de inicializacion se montan UNO POR UNO y no el directorio
      # sql/ completo: ahi vive tambien 01-bases-y-usuarios.ejemplo.sql, que es
      # documentacion. Montado el directorio entero MySQL lo ejecutaria —termina
      # en .sql y ordena antes que el .sh— y crearia los usuarios con las claves
      # de marcador.
      - ./sql/01-bases-y-usuarios.sh:/docker-entrypoint-initdb.d/01-bases-y-usuarios.sh:ro
      - ./sql/02-esquema-vigia.sql:/docker-entrypoint-initdb.d/02-esquema-vigia.sql:ro
      - ./sql/03-esquema-pastillero.sql:/docker-entrypoint-initdb.d/03-esquema-pastillero.sql:ro
      - ./sql/04-esquema-caja.sql:/docker-entrypoint-initdb.d/04-esquema-caja.sql:ro
      - ./sql/05-esquema-consultas.sql:/docker-entrypoint-initdb.d/05-esquema-consultas.sql:ro
    # Descomente para inspeccionar la base con MySQL Workbench. En la entrega
    # la base no se expone al equipo anfitrion.
    # ports:
    #   - "3306:3306"
    healthcheck:
      # CMD-SHELL y no CMD: la forma CMD no pasa por un shell, asi que la
      # variable con la clave no se expandiria y el ping iria sin credencial.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      # El primer arranque tarda entre 20 y 40 segundos.
      start_period: 60s
    restart: unless-stopped
    networks: [asilo]

  ms-vigia:
    build: ./ms-vigia
    container_name: ms-vigia
    environment:
      TZ: America/Guatemala
      BD_HOST: bd-asilo
      BD_PUERTO: "3306"
      BD_NOMBRE: asilo_vigia
      BD_USUARIO: usr_vigia
      BD_CLAVE: ${BD_CLAVE_VIGIA:?falta BD_CLAVE_VIGIA. Copie .env.ejemplo a .env}
      # Sin depends_on a proposito: ms-pastillero ya depende de ms-vigia y se
      # armaria un ciclo. La llamada es en tiempo de peticion, no de arranque.
      PASTILLERO_URL: http://ms-pastillero:8082
      GATEWAY_SECRETO: ${GATEWAY_SECRETO:?falta GATEWAY_SECRETO. Copie .env.ejemplo a .env y genere uno con "openssl rand -hex 32"}
    depends_on:
      bd-asilo:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

  ms-pastillero:
    build: ./ms-pastillero
    container_name: ms-pastillero
    environment:
      TZ: America/Guatemala
      BD_HOST: bd-asilo
      BD_PUERTO: "3306"
      BD_NOMBRE: asilo_pastillero
      BD_USUARIO: usr_pastillero
      BD_CLAVE: ${BD_CLAVE_PASTILLERO:?falta BD_CLAVE_PASTILLERO. Copie .env.ejemplo a .env}
      VIGIA_URL: http://ms-vigia:8081
      # Solo para comprobar la deuda al egresar a un interno.
      CAJA_URL: http://ms-caja:8083
      TOLERANCIA_MIN: "60"
      SEMBRAR: "1"
      GATEWAY_SECRETO: ${GATEWAY_SECRETO:?falta GATEWAY_SECRETO. Copie .env.ejemplo a .env y genere uno con "openssl rand -hex 32"}
    depends_on:
      bd-asilo:
        condition: service_healthy
      ms-vigia:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

  ms-caja:
    build: ./ms-caja
    container_name: ms-caja
    environment:
      TZ: America/Guatemala
      BD_HOST: bd-asilo
      BD_PUERTO: "3306"
      BD_NOMBRE: asilo_caja
      BD_USUARIO: usr_caja
      BD_CLAVE: ${BD_CLAVE_CAJA:?falta BD_CLAVE_CAJA. Copie .env.ejemplo a .env}
      SEMBRAR: "1"
      GATEWAY_SECRETO: ${GATEWAY_SECRETO:?falta GATEWAY_SECRETO. Copie .env.ejemplo a .env y genere uno con "openssl rand -hex 32"}
    depends_on:
      bd-asilo:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

  ms-consultas:
    build: ./ms-consultas
    container_name: ms-consultas
    environment:
      TZ: America/Guatemala
      BD_HOST: bd-asilo
      BD_PUERTO: "3306"
      BD_NOMBRE: asilo_consultas
      BD_USUARIO: usr_consultas
      BD_CLAVE: ${BD_CLAVE_CONSULTAS:?falta BD_CLAVE_CONSULTAS. Copie .env.ejemplo a .env}
      PASTILLERO_URL: http://ms-pastillero:8082
      VIGIA_URL: http://ms-vigia:8081
      CAJA_URL: http://ms-caja:8083
      # "0" arranca con la cadena clinica vacia.
      SEMBRAR: "1"
      # Todas opcionales: sin SMTP_HOST el aviso al familiar no se envia, pero
      # queda en la bitacora y en la tabla correos_enviados.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_DE: ${SMTP_DE:-asilo@cabezadealgodon.local}
      GATEWAY_SECRETO: ${GATEWAY_SECRETO:?falta GATEWAY_SECRETO. Copie .env.ejemplo a .env y genere uno con "openssl rand -hex 32"}
    depends_on:
      bd-asilo:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    environment:
      TZ: America/Guatemala
      PUERTO: "8080"
      GATEWAY_SECRETO: ${GATEWAY_SECRETO:?falta GATEWAY_SECRETO. Copie .env.ejemplo a .env y genere uno con "openssl rand -hex 32"}
      GATEWAY_DURACION_SESION: ${GATEWAY_DURACION_SESION:-8h}
      ORIGEN_PERMITIDO: ${ORIGEN_PERMITIDO:-http://localhost:8090}
      # Apagada por defecto: las credenciales de demostracion no se imprimen en
      # la pantalla de acceso salvo que se pida expresamente en el .env.
      MOSTRAR_USUARIOS_DEMO: ${MOSTRAR_USUARIOS_DEMO:-0}
      VIGIA_URL: http://ms-vigia:8081
      PASTILLERO_URL: http://ms-pastillero:8082
      CAJA_URL: http://ms-caja:8083
      CONSULTAS_URL: http://ms-consultas:8084
    ports:
      - "8080:8080"
    depends_on:
      bd-asilo:
        condition: service_healthy
      ms-vigia:
        condition: service_healthy
      ms-pastillero:
        condition: service_healthy
      ms-caja:
        condition: service_healthy
      ms-consultas:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

  estacion-web:
    build: ./estacion-web
    container_name: estacion-web
    ports:
      - "8090:80"
    depends_on:
      ms-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks: [asilo]

volumes:
  bd-datos:

networks:
  asilo:
    driver: bridge
