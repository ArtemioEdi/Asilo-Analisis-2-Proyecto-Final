server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    location = /salud { default_type text/plain; return 200 "estacion-web arriba\n"; }

    # Todo pasa por ms-gateway, que exige sesion y valida el rol. Nginx no
    # habla con los microservicios: el navegador conoce un solo origen.
    set $ms_gateway http://ms-gateway:8080;

    location /api/ {
        proxy_pass $ms_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /vigia/ {
        proxy_pass $ms_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /pastillero/ {
        proxy_pass $ms_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /caja/ {
        proxy_pass $ms_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /consultas/ {
        proxy_pass $ms_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
